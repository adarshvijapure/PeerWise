{% extends "base.html" %}
{% block title %}Create a Study Group{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-card__header">
      <h1 class="form-title">✨ Create a Study Group</h1>
      <p class="form-subtitle">Invite your classmates and start solving problems together.</p>
    </div>

    <form method="POST" action="{{ url_for('groups.create') }}">
      <div class="form-group">
        <label class="form-label" for="name">Group Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" class="input" required
               placeholder="e.g., DSA Study Buddies, Organic Chemistry Help" />
      </div>

      <div class="form-group">
        <label class="form-label" for="subject">Subject / Course</label>
        <input type="text" id="subject" name="subject" class="input"
               placeholder="e.g., Data Structures, Thermodynamics, MKTG 301" />
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" name="description" class="input input--textarea" rows="3"
                  placeholder="What is this group for? Any rules for posting queries?"></textarea>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg">
        Create Group & Get Invite Link →
      </button>
    </form>
  </div>
</div>
{% endblock %}
